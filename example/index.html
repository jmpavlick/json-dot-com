<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elm App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="app"></div>
    <script src="/main.js"></script>
    <script>
        var app = Elm.Main.init({
            node: document.getElementById('app')
        });

        // Modal dialog ports
        app.ports.openDialog.subscribe(function(dialogId) {
            var dialog = document.getElementById(dialogId);
            if (dialog) {
                dialog.showModal();
            }
        });

        app.ports.closeDialog.subscribe(function(dialogId) {
            var dialog = document.getElementById(dialogId);
            if (dialog) {
                dialog.close();
            }
        });
    </script>
</body>
</html>
